  ? (() => { try { return window.supabase.createClient(_cfg.SUPABASE_URL, _cfg.SUPABASE_KEY); } catch(e){ console.warn("Supabase init failed:",e); return null; } })()

// ── STORAGE LAYER ──
const DB_PREFIX = "bakara_";

class Storage {
  constructor() {
    this.supabase = supabase;
    this.online = !!supabase;
  }

  async get(key) {
    if (this.online) {
      try {
        // Course entre la requête Supabase et un timeout de 5s
        const req = this.supabase.from('bakara_data').select('data').eq('id', key).single();
        const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),5000));
        const { data, error } = await Promise.race([req, timeout]);
        if (!error && data) return data.data;
      } catch(e) { console.warn("Supabase read failed/timeout, using local:", e); }
    }
    const v = localStorage.getItem(DB_PREFIX + key);
    return v ? JSON.parse(v) : null;
  }

  async set(key, value) {
    localStorage.setItem(DB_PREFIX + key, JSON.stringify(value));
    if (this.online) {
      try {
        await this.supabase.from('bakara_data').upsert({ id: key, data: value, updated_at: new Date().toISOString() });
      } catch(e) { console.warn("Supabase write failed:", e); }
    }
  }

  isOnline() { return this.online; }
}

const storage = new Storage();

async function loadData(key, fallback) {
  const d = await storage.get(key);
  if(!d) return fallback;
  // Migration douce : anciennes données vers le nouveau modèle (liens + payé booléen)
  if(key==="locataires") return d.map(l=>{
    if(l.pay) return {...l, bienId: l.bienId!==undefined?l.bienId:null}; // déjà au nouveau format
    // ancien format : months={mois:montant ou true} → pay={"2025-mois":{date,mode}}
    const pay={};
    Object.keys(l.months||{}).forEach(k=>{ if(l.months[k]){ const mi=+k; pay["2025-"+mi]={date:"2025-"+String(mi+1).padStart(2,"0")+"-10",mode:"espece"}; } });
    return {...l, pay, months:undefined, bienId: l.bienId!==undefined?l.bienId:null};
  });
  if(key==="biens") return d.map(b=>({
    ...b,
    locataireId: b.locataireId!==undefined?b.locataireId:null
  }));
  return d;
}
async function saveData(key, data) { await storage.set(key, data); }

function LoginScreen({onLogin}){
  const [email,setEmail]=useState("");
  const [pwd,setPwd]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);

  const doLogin=async()=>{
    if(!email||!pwd){setErr("Email et mot de passe requis");return}
    setBusy(true);setErr("");
    try {
      const {data,error}=await supabase.auth.signInWithPassword({email:email.trim(),password:pwd});
      if(error){setErr(error.message==="Invalid login credentials"?"Email ou mot de passe incorrect":error.message);setBusy(false);return}
      onLogin(data.session);
    } catch(e){setErr("Erreur de connexion: "+e.message);setBusy(false)}
  };

  const onKey=e=>{if(e.key==="Enter")doLogin()};

  return(<div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e293b)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>

        <p style={{fontSize:11,color:"#94a3b8",marginTop:4}}>Gestion financiere - Connexion</p>
      </div>
      <div onKeyDown={onKey}>
        <Inp l="Email" v={email} onChange={setEmail} type="email" ph="email@exemple.com"/>
        <Inp l="Mot de passe" v={pwd} onChange={setPwd} type="password" ph="********"/>

// ── BIENS ──
function Biens({data,setData,save,ro,locs,setLocs,saveLocs}){
  const [show,setShow]=useState(false),[fil,setFil]=useState("tous");
  const [form,setF]=useState({nom:"",type:"Magasin",loyer:0,prev:0,surf:0,statut:"vide",locataireId:""}),[eid,setEid]=useState(null);
  const totA=data.reduce((s,b)=>s+(b.loyer||0),0), totP=data.reduce((s,b)=>s+(b.prev||0),0);
  const locName=id=>{const l=locs.find(x=>x.id===id);return l?l.name:null};
  const isLoue=b=>!!b.locataireId;
  const vides=data.filter(b=>!isLoue(b)).length;
  let list=data;
  if(fil==="loue")list=data.filter(isLoue); else if(fil==="vide")list=data.filter(b=>!isLoue(b));
  else if(fil==="Magasin")list=data.filter(b=>b.type.startsWith("Magasin"));
  else if(fil==="Appartement")list=data.filter(b=>b.type.startsWith("Appartement")||b.type==="Studio");

  // Synchronise le lien des deux côtés : un bien pointe vers un locataire, le locataire pointe vers le bien
  const linkBienLoc=(bienId,locataireId,baseBiens,baseLocs)=>{
    const bId=bienId, lId=locataireId?+locataireId:null;
    // 1) libère l'ancien locataire de ce bien + libère le bien que prenait ce locataire ailleurs
    let nb=baseBiens.map(b=>{
      if(b.id===bId)return{...b,locataireId:lId};
      if(lId && b.locataireId===lId)return{...b,locataireId:null}; // ce locataire quitte son ancien bien
      return b;
    });
    let nl=baseLocs.map(l=>{
      if(l.id===lId)return{...l,bienId:bId};
      if(l.bienId===bId && l.id!==lId)return{...l,bienId:null}; // ancien locataire de ce bien est délié
      return l;
    });
    return {nb,nl};
  };

  const doSave=()=>{if(!form.nom)return;
    // "Loué" exige un locataire ; "Vide" délie tout locataire
    if(form.statut==="loue" && !form.locataireId){alert("Pour un bien « Loué », choisissez un locataire.");return}
    const locId=form.statut==="loue"?form.locataireId:"";
    const obj={nom:form.nom,type:form.type,loyer:+form.loyer||0,prev:+form.prev||0,surf:+form.surf||0};
    let base=eid?data.map(x=>x.id===eid?{...x,...obj}:x):[...data,{...obj,id:Date.now(),num:data.length+1,locataireId:null}];
    const targetId=eid||base[base.length-1].id;
    const {nb,nl}=linkBienLoc(targetId,locId,base,locs);
    setData(nb);save(nb);setLocs(nl);saveLocs(nl);
    setEid(null);setShow(false)};
  const doEdit=b=>{setF({nom:b.nom,type:b.type,loyer:b.loyer,prev:b.prev,surf:b.surf,statut:b.locataireId?"loue":"vide",locataireId:b.locataireId||""});setEid(b.id);setShow(true)};
  const doAdd=()=>{setEid(null);setF({nom:"",type:"Magasin",loyer:0,prev:0,surf:0,statut:"vide",locataireId:""});setShow(true)};
  const doDel=id=>{if(!confirm("Supprimer ce bien ?"))return;const nb=data.filter(x=>x.id!==id);const nl=locs.map(l=>l.bienId===id?{...l,bienId:null}:l);setData(nb);save(nb);setLocs(nl);saveLocs(nl)};
  const chip=(k,lbl)=><button onClick={()=>setFil(k)} style={{padding:"7px 13px",borderRadius:20,border:"1.5px solid "+(fil===k?"#3b82f6":"#e2e8f0"),background:fil===k?"#3b82f6":"#fff",color:fil===k?"#fff":"#64748b",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}>{lbl}</button>;
  // locataires disponibles pour le select (non liés, ou lié au bien courant)
  const locOpts=[{id:"",name:"— Vacant —"}].concat(locs.filter(l=>!l.bienId||l.bienId===eid).map(l=>({id:l.id,name:l.name+" ("+fmt(l.rent)+"/m)"})));

  return(<div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
      <div style={{background:"#fff",borderRadius:12,padding:"14px 16px",border:"1px solid #e2e8f0",borderLeft:"4px solid #16a34a"}}>
        <div style={{fontSize:10,fontWeight:700,color:"#16a34a",letterSpacing:.5,textTransform:"uppercase"}}>Loyer actuel/mois</div>
        <div className="mono" style={{fontSize:20,fontWeight:800,marginTop:4}}>{fmt(totA)}</div>
        <div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{data.length} bien(s)</div>
      </div>
      <div style={{background:"#fff",borderRadius:12,padding:"14px 16px",border:"1px solid #e2e8f0",borderLeft:"4px solid #f59e0b"}}>
        <div style={{fontSize:10,fontWeight:700,color:"#f59e0b",letterSpacing:.5,textTransform:"uppercase"}}>Previsionnel/mois</div>
        <div className="mono" style={{fontSize:20,fontWeight:800,marginTop:4}}>{fmt(totP)}</div>
        <div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{vides} vide(s)</div>
      </div>
    </div>
    <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",alignItems:"center"}}>
      {!ro&&<Btn onClick={doAdd} c="#16a34a">+ Bien</Btn>}
      {chip("tous","Tous")}{chip("loue","Loués")}{chip("vide","Vides")}{chip("Magasin","Magasins")}{chip("Appartement","Apparts")}
    </div>
    <div style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
      {list.map((b,i)=>{const ln=locName(b.locataireId);return <div key={b.id} style={{padding:"13px 16px",borderTop:i?"1px solid #f1f5f9":"none",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
        <div style={{minWidth:0}}>
          <div style={{fontWeight:700,fontSize:14}}>{b.nom}</div>
          <div style={{fontSize:11,color:"#64748b",marginTop:3,lineHeight:1.5}}>{b.surf?b.surf+" m² · ":""}{ln?"👤 "+ln:"Disponible"}</div>
          <div style={{marginTop:7,display:"flex",gap:5,flexWrap:"wrap"}}><Badge t={b.type.split("/")[0]} c="#64748b"/><Badge t={ln?"Loué":"Vide"} c={ln?"#16a34a":"#dc2626"}/></div>
        </div>
        <div style={{textAlign:"right",whiteSpace:"nowrap"}}>
          <div className="mono" style={{fontSize:13,fontWeight:800,color:b.loyer?"#16a34a":"#f59e0b"}}>{b.loyer?fmt(b.loyer):"prév. "+fmt(b.prev)}</div>
          {!ro&&<div style={{marginTop:6}}>
            <button onClick={()=>doEdit(b)} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:"#3b82f6",padding:3}}>&#9998;</button>
            <button onClick={()=>doDel(b.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:"#ef4444",padding:3}}>&#10005;</button>
          </div>}
        </div>
      </div>})}
      {!list.length&&<div style={{padding:30,textAlign:"center",color:"#94a3b8",fontSize:12}}>Aucun bien dans ce filtre.</div>}
    </div>
    <Modal show={show} onClose={()=>setShow(false)} title={eid?"Modifier le bien":"Nouveau bien"}>
      <Inp l="Nom / désignation" v={form.nom} onChange={v=>setF({...form,nom:v})} ph="Ex: Magasin n°18"/>
      <Inp l="Type" v={form.type} onChange={v=>setF({...form,type:v})} opts={["Magasin","Appartement","Studio","Appartement/Bidonville"]}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <Inp l="Loyer actuel" v={form.loyer} onChange={v=>setF({...form,loyer:v})} type="number"/>
        <Inp l="Loyer prévis." v={form.prev} onChange={v=>setF({...form,prev:v})} type="number"/>
      </div>
      <Inp l="Surface m²" v={form.surf} onChange={v=>setF({...form,surf:v})} type="number"/>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:10,fontWeight:600,color:"#64748b",marginBottom:6,textTransform:"uppercase",letterSpacing:.5}}>Statut</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <button onClick={()=>setF({...form,statut:"loue"})} style={{padding:"11px",borderRadius:10,border:"2px solid "+(form.statut==="loue"?"#16a34a":"#e2e8f0"),background:form.statut==="loue"?"#f0fdf4":"#fff",color:form.statut==="loue"?"#16a34a":"#475569",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Loué</button>
          <button onClick={()=>setF({...form,statut:"vide",locataireId:""})} style={{padding:"11px",borderRadius:10,border:"2px solid "+(form.statut==="vide"?"#dc2626":"#e2e8f0"),background:form.statut==="vide"?"#fef2f2":"#fff",color:form.statut==="vide"?"#dc2626":"#475569",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Vide</button>
        </div>
      </div>
      {form.statut==="loue"&&<div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:10,fontWeight:600,color:"#64748b",marginBottom:3,textTransform:"uppercase",letterSpacing:.5}}>Locataire <span style={{color:"#dc2626"}}>*</span></label>
        <select value={form.locataireId} onChange={e=>setF({...form,locataireId:e.target.value})} style={{width:"100%",padding:"8px 12px",border:"1.5px solid "+(form.locataireId?"#e2e8f0":"#fca5a5"),borderRadius:8,fontSize:13,background:"#fff",boxSizing:"border-box"}}>
          {locOpts.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
        </select>
        <div style={{fontSize:10,color:"#94a3b8",marginTop:4}}>Obligatoire pour un bien loué. Pour créer un locataire, allez dans l'onglet Loyers.</div>
      </div>}
      <div style={{display:"flex",gap:6,justifyContent:"flex-end",marginTop:6}}>
        <Btn onClick={()=>setShow(false)} outline c="#64748b">Annuler</Btn>
        <Btn onClick={doSave} disabled={!form.nom}>{eid?"Modifier":"Ajouter"}</Btn>
      </div>
    </Modal>
    {!ro&&<button className="fab" onClick={doAdd} aria-label="Nouveau bien">+</button>}
  </div>);
}

// ── LOYERS : gestion par mois & année, validation paiement (mode + date) ──
function Loyers({data,setData,save,ro,biens,setBiens,saveBiens}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [payModal,setPayModal]=useState(null); // {loc} en cours de validation
  const [payForm,setPayForm]=useState({mode:"espece",date:"",montant:0});
  const [edit,setEdit]=useState(false),[form,setF]=useState({name:"",rent:0,bienId:""}),[eid,setEid]=useState(null);
  const [histLoc,setHistLoc]=useState(null); // locataire dont on voit l'historique

  const key=(y,m)=>y+"-"+m;
  const isPaid=(c,y,m)=>!!(c.pay&&c.pay[key(y,m)]);
  const bienName=id=>{const b=biens.find(x=>x.id===id);return b?b.nom:null};

  // années présentes dans les données + année courante
  const years=(()=>{const set=new Set([2025,2026,now.getFullYear()]);data.forEach(c=>Object.keys(c.pay||{}).forEach(k=>set.add(+k.split("-")[0])));return[...set].sort((a,b)=>b-a)})();

  // stats du mois sélectionné
  const moisLocs=data; // tous les locataires concernés
  const paidThis=moisLocs.filter(c=>isPaid(c,year,month));
  const dueThis=moisLocs.filter(c=>!isPaid(c,year,month));
  const encThisMonth=paidThis.reduce((s,c)=>s+(c.rent||0),0);
  const dueThisMonth=dueThis.reduce((s,c)=>s+(c.rent||0),0);
  // stats année
  const encYear=data.reduce((s,c)=>{let n=0;for(let m=0;m<12;m++)if(isPaid(c,year,m))n++;return s+n*(c.rent||0)},0);
  const expectedYear=data.reduce((s,c)=>s+(c.rent||0)*12,0);

  const openPay=c=>{if(ro)return;const ex=c.pay&&c.pay[key(year,month)];
    setPayForm({mode:ex?ex.mode:"espece",date:ex?ex.date:`${year}-${String(month+1).padStart(2,"0")}-10`,montant:c.rent});
    setPayModal(c)};
  const confirmPay=()=>{const c=payModal;const u=data.map(x=>{if(x.id!==c.id)return x;const pay={...(x.pay||{})};pay[key(year,month)]={date:payForm.date,mode:payForm.mode};return{...x,pay}});setData(u);save(u);setPayModal(null)};
  const cancelPay=c=>{if(ro)return;if(!confirm("Annuler le paiement de "+c.name+" pour "+MOIS12[month]+" "+year+" ?"))return;const u=data.map(x=>{if(x.id!==c.id)return x;const pay={...(x.pay||{})};delete pay[key(year,month)];return{...x,pay}});setData(u);save(u)};

  // CRUD locataire
  const linkLocBien=(locId,bienId,baseLocs,baseBiens)=>{const bId=bienId?+bienId:null;
    let nl=baseLocs.map(l=>l.id===locId?{...l,bienId:bId}:(bId&&l.bienId===bId?{...l,bienId:null}:l));
    let nb=baseBiens.map(b=>b.id===bId?{...b,locataireId:locId}:(b.locataireId===locId&&b.id!==bId?{...b,locataireId:null}:b));
    return{nl,nb}};
  const doSaveLoc=()=>{if(!form.name)return;
    let base=eid?data.map(c=>c.id===eid?{...c,name:form.name,rent:+form.rent||0}:c):[...data,{id:Date.now(),name:form.name,rent:+form.rent||0,pay:{},bienId:null}];
    const targetId=eid||base[base.length-1].id;
    const {nl,nb}=linkLocBien(targetId,form.bienId,base,biens);
    setData(nl);save(nl);setBiens(nb);saveBiens(nb);setEid(null);setEdit(false)};
  const editLoc=c=>{setF({name:c.name,rent:c.rent,bienId:c.bienId||""});setEid(c.id);setEdit(true)};
  const addLoc=()=>{setEid(null);setF({name:"",rent:0,bienId:""});setEdit(true)};
  const delLoc=id=>{if(!confirm("Supprimer ce locataire ?"))return;const nl=data.filter(x=>x.id!==id);const nb=biens.map(b=>b.locataireId===id?{...b,locataireId:null}:b);setData(nl);save(nl);setBiens(nb);saveBiens(nb)};
  const bienOpts=[{id:"",name:"— Aucun —"}].concat(biens.filter(b=>!b.locataireId||b.locataireId===eid).map(b=>({id:b.id,name:b.nom+(b.loyer?" ("+fmt(b.loyer)+"/m)":"")})));

  const pct=moisLocs.length?Math.round(paidThis.length/moisLocs.length*100):0;

  return(<div>
    {/* DASHBOARD LOYERS */}
    <div style={{background:"linear-gradient(135deg,#1e40af,#7c3aed)",borderRadius:18,padding:"20px 22px",color:"#fff",marginBottom:14,position:"relative",overflow:"hidden",boxShadow:"0 8px 24px rgba(59,130,246,0.25)"}}>
      <div style={{position:"absolute",top:-30,right:-30,width:140,height:140,borderRadius:"50%",background:"rgba(255,255,255,0.08)"}}/>
      <div style={{position:"relative"}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",opacity:.85}}>Loyers encaissés · {MOIS12[month]} {year}</div>
        <div className="mono" style={{fontSize:32,fontWeight:800,marginTop:6,lineHeight:1}}>{fmt(encThisMonth)} <span style={{fontSize:15,opacity:.7}}>MAD</span></div>
        <div style={{display:"flex",gap:14,marginTop:10,fontSize:11,flexWrap:"wrap"}}>
          <span style={{padding:"3px 10px",background:"rgba(255,255,255,0.18)",borderRadius:20,fontWeight:600}}>✓ {paidThis.length} payé(s)</span>
          <span style={{padding:"3px 10px",background:"rgba(255,255,255,0.18)",borderRadius:20,fontWeight:600}}>⏳ {dueThis.length} en attente · {fmt(dueThisMonth)}</span>
        </div>
        <div style={{marginTop:12,height:7,background:"rgba(255,255,255,0.2)",borderRadius:5,overflow:"hidden"}}>
          <div style={{width:pct+"%",height:"100%",background:"#fff",borderRadius:5,transition:"width .4s"}}/>
        </div>
        <div style={{fontSize:10,opacity:.8,marginTop:5}}>{pct}% des loyers du mois recouvrés · Année {year} : {fmt(encYear)} / {fmt(expectedYear)}</div>
      </div>
    </div>

    {/* PARTS DES PROPRIETAIRES POUR CE MOIS */}
    <div style={{background:"#fff",borderRadius:14,border:"1px solid #e2e8f0",overflow:"hidden",marginBottom:14,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
      <div style={{padding:"11px 16px",borderBottom:"1px solid #f1f5f9",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h4 style={{fontSize:11,fontWeight:700,color:"#1e293b",textTransform:"uppercase",letterSpacing:.5}}>⚖️ Parts des propriétaires · {MOIS12[month]} {year}</h4>
        <span className="mono" style={{fontSize:11,fontWeight:700,color:"#16a34a"}}>{fmt(encThisMonth)}</span>
      </div>
      <div style={{display:"flex",height:34,margin:"12px 16px 6px",borderRadius:9,overflow:"hidden",fontSize:12,fontWeight:800}}>
        <div style={{flex:75,background:"linear-gradient(135deg,#3b82f6,#8b5cf6)",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center"}}>Hajar 75%</div>
        <div style={{flex:25,background:"#334155",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center"}}>Malika 25%</div>
      </div>
      <div style={{padding:"6px 16px 8px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #f1f5f9"}}>
        <div><div style={{fontWeight:600,fontSize:13}}>{OWNERS.hajar.name}</div><div style={{fontSize:10,color:"#94a3b8"}}>75% des loyers encaissés ce mois</div></div>
        <div className="mono" style={{fontWeight:800,fontSize:16,color:"#3b82f6"}}>{fmt(encThisMonth*0.75)}</div>
      </div>
      <div style={{padding:"8px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontWeight:600,fontSize:13}}>{OWNERS.malika.name}</div><div style={{fontSize:10,color:"#94a3b8"}}>25% des loyers encaissés ce mois</div></div>
        <div className="mono" style={{fontWeight:800,fontSize:16,color:"#334155"}}>{fmt(encThisMonth*0.25)}</div>
      </div>
      <div style={{padding:"9px 16px",background:"#f8fafc",fontSize:10.5,color:"#94a3b8"}}>Sur l'année {year} : Hajar {fmt(encYear*0.75)} · Malika {fmt(encYear*0.25)}</div>
    </div>

    {/* SELECTEUR ANNEE */}
    <div style={{display:"flex",gap:6,marginBottom:10,overflowX:"auto",alignItems:"center"}}>
      <span style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:.5,flexShrink:0}}>Année</span>
      {years.map(y=><button key={y} onClick={()=>setYear(y)} style={{flexShrink:0,padding:"7px 14px",borderRadius:20,border:"1.5px solid "+(year===y?"#3b82f6":"#e2e8f0"),background:year===y?"#3b82f6":"#fff",color:year===y?"#fff":"#64748b",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{y}</button>)}
    </div>
    {/* SELECTEUR MOIS */}
    <div style={{display:"flex",gap:6,marginBottom:14,overflowX:"auto",paddingBottom:2}}>
      {MOIS_C.map((m,i)=>{const enc=data.filter(c=>isPaid(c,year,i)).length;const tot=data.length;const full=tot>0&&enc===tot;
      return<button key={i} onClick={()=>setMonth(i)} style={{flexShrink:0,minWidth:52,padding:"8px 6px",borderRadius:10,border:"1.5px solid "+(month===i?"#3b82f6":"#e2e8f0"),background:month===i?"#eff6ff":"#fff",cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}>
        <div style={{fontSize:11,fontWeight:700,color:month===i?"#3b82f6":"#475569"}}>{m}</div>
        <div style={{fontSize:9,marginTop:3,color:full?"#16a34a":"#94a3b8",fontWeight:600}}>{enc}/{tot}</div>
      </button>})}
    </div>

    {!ro&&<div style={{marginBottom:12}}><Btn onClick={addLoc} c="#16a34a">+ Locataire</Btn></div>}

    {/* LISTE LOCATAIRES DU MOIS */}
    <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:.5,margin:"4px 4px 8px"}}>
      {MOIS12[month]} {year} — qui a payé / qui doit
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:9}}>
      {data.map(c=>{const paid=isPaid(c,year,month);const info=paid?c.pay[key(year,month)]:null;const mm=info?modeMeta(info.mode):null;const bn=bienName(c.bienId);
      return(<div key={c.id} style={{background:"#fff",borderRadius:13,border:"1px solid #e2e8f0",borderLeft:"4px solid "+(paid?"#16a34a":"#f59e0b"),padding:"13px 14px",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
          <div style={{minWidth:0,flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
              <span style={{fontWeight:700,fontSize:15}}>{c.name}</span>
              {paid?<span style={{fontSize:10,fontWeight:700,padding:"2px 9px",borderRadius:20,background:"#dcfce7",color:"#16a34a"}}>✓ PAYÉ</span>
                   :<span style={{fontSize:10,fontWeight:700,padding:"2px 9px",borderRadius:20,background:"#fef3c7",color:"#b45309"}}>⏳ À PAYER</span>}
            </div>
            <div style={{fontSize:11,color:"#64748b",marginTop:3}}>{fmt(c.rent)}/mois{bn?" · 🏛 "+bn:""}</div>
            {paid&&<div style={{fontSize:11,marginTop:5,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
              <span style={{padding:"2px 9px",borderRadius:20,background:mm.c+"18",color:mm.c,fontWeight:600}}>{mm.ic} {mm.l}</span>
              <span style={{color:"#94a3b8"}}>le {info.date?new Date(info.date).toLocaleDateString("fr-FR"):"—"}</span>
            </div>}
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
            {!ro&&(paid
              ? <button onClick={()=>cancelPay(c)} style={{padding:"8px 13px",border:"1.5px solid #fecaca",background:"#fff",color:"#dc2626",borderRadius:9,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>Annuler</button>
              : <button onClick={()=>openPay(c)} style={{padding:"9px 15px",border:"none",background:"#16a34a",color:"#fff",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",boxShadow:"0 2px 6px rgba(22,163,74,0.3)"}}>Valider</button>)}
            <div style={{display:"flex",gap:2}}>
              <button onClick={()=>setHistLoc(c)} title="Historique" style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:"#64748b",padding:3}}>📅</button>
              {!ro&&<button onClick={()=>editLoc(c)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#3b82f6",padding:3}}>&#9998;</button>}
              {!ro&&<button onClick={()=>delLoc(c.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#ef4444",padding:3}}>&#10005;</button>}
            </div>
          </div>
        </div>
      </div>)})}
      {!data.length&&<div style={{padding:30,textAlign:"center",color:"#94a3b8",fontSize:12,background:"#fff",borderRadius:13,border:"1px dashed #e2e8f0"}}>Aucun locataire. Touchez « + Locataire ».</div>}
    </div>

    {/* MODAL VALIDATION PAIEMENT */}
    <Modal show={!!payModal} onClose={()=>setPayModal(null)} title={payModal?"Paiement — "+payModal.name:""}>
      {payModal&&<div>
        <div style={{background:"#f8fafc",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#475569"}}>
          <b>{MOIS12[month]} {year}</b> · Loyer dû : <b className="mono">{fmt(payModal.rent)} MAD</b>
        </div>
        <label style={{display:"block",fontSize:10,fontWeight:600,color:"#64748b",marginBottom:6,textTransform:"uppercase",letterSpacing:.5}}>Mode de règlement</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
          {PAY_MODES.map(m=><button key={m.k} onClick={()=>setPayForm({...payForm,mode:m.k})} style={{padding:"12px 4px",borderRadius:11,border:"2px solid "+(payForm.mode===m.k?m.c:"#e2e8f0"),background:payForm.mode===m.k?m.c+"12":"#fff",cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}>
            <div style={{fontSize:20}}>{m.ic}</div>
            <div style={{fontSize:11,fontWeight:700,marginTop:3,color:payForm.mode===m.k?m.c:"#475569"}}>{m.l}</div>
          </button>)}
        </div>
        <Inp l="Date du paiement" v={payForm.date} onChange={v=>setPayForm({...payForm,date:v})} type="date"/>
        <div style={{display:"flex",gap:6,justifyContent:"flex-end",marginTop:10}}>
          <Btn onClick={()=>setPayModal(null)} outline c="#64748b">Annuler</Btn>
          <Btn onClick={confirmPay} c="#16a34a">✓ Confirmer le paiement</Btn>
        </div>
      </div>}
    </Modal>

    {/* MODAL HISTORIQUE LOCATAIRE */}
    <Modal show={!!histLoc} onClose={()=>setHistLoc(null)} title={histLoc?"Historique — "+histLoc.name:""}>
      {histLoc&&<div>
        {years.map(y=>{const paidN=(()=>{let n=0;for(let m=0;m<12;m++)if(isPaid(histLoc,y,m))n++;return n})();
        return<div key={y} style={{marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontWeight:700,fontSize:14}}>{y}</span>
            <span style={{fontSize:11,color:paidN===12?"#16a34a":"#64748b",fontWeight:600}}>{paidN}/12 · {fmt(paidN*(histLoc.rent||0))}</span>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:5}}>
            {MOIS_C.map((m,i)=>{const p=isPaid(histLoc,y,i);const info=p?histLoc.pay[key(y,i)]:null;const mm=info?modeMeta(info.mode):null;
            return<div key={i} style={{border:"1.5px solid "+(p?"#86efac":"#e2e8f0"),borderRadius:8,padding:"6px 2px",textAlign:"center",background:p?"#f0fdf4":"#f8fafc"}}>
              <div style={{fontSize:9,fontWeight:700,color:"#94a3b8"}}>{m}</div>
              <div style={{fontSize:13,marginTop:2,color:p?"#16a34a":"#cbd5e1"}}>{p?mm.ic:"○"}</div>
            </div>})}
          </div>
        </div>})}
      </div>}
    </Modal>

    {/* MODAL EDITION LOCATAIRE */}
    <Modal show={edit} onClose={()=>setEdit(false)} title={eid?"Modifier le locataire":"Nouveau locataire"}>
      <Inp l="Nom" v={form.name} onChange={v=>setF({...form,name:v})} ph="Ex: Benani"/>
      <Inp l="Loyer mensuel (MAD)" v={form.rent} onChange={v=>setF({...form,rent:v})} type="number"/>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:10,fontWeight:600,color:"#64748b",marginBottom:3,textTransform:"uppercase",letterSpacing:.5}}>Bien loué</label>
        <select value={form.bienId} onChange={e=>setF({...form,bienId:e.target.value})} style={{width:"100%",padding:"8px 12px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,background:"#fff",boxSizing:"border-box"}}>
          {bienOpts.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
        </select>
      </div>
      <div style={{display:"flex",gap:6,justifyContent:"flex-end",marginTop:6}}>
        <Btn onClick={()=>setEdit(false)} outline c="#64748b">Annuler</Btn>
        <Btn onClick={doSaveLoc} disabled={!form.name}>{eid?"Modifier":"Ajouter"}</Btn>
      </div>
    </Modal>
    {!ro&&<button className="fab" onClick={addLoc} aria-label="Nouveau locataire">+</button>}
  </div>);
}

// ── MAIN APP ──
const TABS=[{k:"dash",l:"Dashboard",i:"◼"},{k:"ch",l:"Charges",i:"▼"},{k:"al",l:"Alimentation",i:"▲"},{k:"lo",l:"Loyers",i:"📊"},{k:"bi",l:"Biens",i:"🏛"}];

function App(){
  const [tab,setTab]=useState("dash"),[loading,setLoading]=useState(true),[saved,setSaved]=useState(false);
  const [ch,setCh]=useState([]),[al,setAl]=useState([]),[bi,setBi]=useState([]),[lo,setLo]=useState([]);
  const [session,setSession]=useState(null),[profile,setProfile]=useState(null),[authReady,setAuthReady]=useState(false);

  // 1) Auth bootstrap: check existing session + subscribe to changes
  useEffect(()=>{
    if(!supabase){setAuthReady(true);return}
    supabase.auth.getSession().then(({data})=>{setSession(data.session);setAuthReady(true)});
    const {data:{subscription}}=supabase.auth.onAuthStateChange((_e,s)=>{
      setSession(s);
      if(!s){setProfile(null);setCh([]);setAl([]);setBi([]);setLo([])}
    });
    return ()=>subscription.unsubscribe();
  },[]);

  // 2) Load profile (role) when session changes
  useEffect(()=>{
    if(!session||!supabase){setProfile(null);return}
    supabase.from('profiles').select('*').eq('id',session.user.id).single().then(({data,error})=>{
      if(error)console.warn("Profile fetch error:",error.message);
      setProfile(data||{role:'guest',email:session.user.email,id:session.user.id});
    });
  },[session]);

  // 3) Load data: when authenticated (or when Supabase is not configured)
  useEffect(()=>{
    if(supabase&&!session){setLoading(false);return}
    let done=false;
    // Sécurité : si le réseau/Supabase ne répond pas en 8s, on démarre quand même
    const safety=setTimeout(()=>{
      if(done)return;
      console.warn("Chargement trop long — démarrage avec les données par défaut.");
      setCh(c=>c.length?c:INIT_CHARGES);setAl(a=>a.length?a:INIT_ALIM);
      setBi(b=>b.length?b:INIT_BIENS);setLo(l=>l.length?l:INIT_LOCS);
      setLoading(false);
    },8000);
    (async()=>{
      setLoading(true);
      // Chaque chargement est protégé : en cas d'erreur, on retombe sur la valeur par défaut
      const safe=(key,fb)=>loadData(key,fb).catch(e=>{console.warn("loadData "+key+" a échoué:",e);return fb});
      const [c,a,b,l]=await Promise.all([safe("charges",INIT_CHARGES),safe("alim",INIT_ALIM),safe("biens",INIT_BIENS),safe("locataires",INIT_LOCS)]);
      done=true;clearTimeout(safety);
      setCh(c);setAl(a);setBi(b);setLo(l);setLoading(false);
    })();
    return ()=>clearTimeout(safety);
  },[session]);

  const flash=useCallback(()=>{setSaved(true);setTimeout(()=>setSaved(false),1500)},[]);
  const sC=d=>{saveData("charges",d);flash()};
  const sA=d=>{saveData("alim",d);flash()};
  const sB=d=>{saveData("biens",d);flash()};
  const sL=d=>{saveData("locataires",d);flash()};

  const logout=async()=>{if(confirm("Se deconnecter ?"))await supabase.auth.signOut()};

  const tc=ch.reduce((s,x)=>s+x.m,0),ta=al.reduce((s,x)=>s+x.m,0);
  const ro=profile?profile.role==='guest':false;
  const roleBadge=profile?{admin:{c:"#16a34a",l:"Admin"},family:{c:"#3b82f6",l:"Famille"},guest:{c:"#64748b",l:"Invite"}}[profile.role]||{c:"#64748b",l:profile.role}:null;

  // Render gates
  if(!authReady)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#64748b"}}>Initialisation...</div>;
  if(supabase&&!session)return<LoginScreen onLogin={setSession}/>;
  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#64748b"}}>Chargement des donnees...</div>;

  return(<div style={{background:"var(--bg)",minHeight:"100vh"}}>
    <div className="header-bar" style={{background:"linear-gradient(135deg,#0f172a,#1e293b)",padding:"14px 16px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,0.15)",paddingTop:"calc(14px + var(--safe-top))"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:8,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:9,background:"linear-gradient(135deg,#3b82f6,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:15,boxShadow:"0 2px 8px rgba(59,130,246,0.4)"}}>B</div>
          <div><div className="logo-text" style={{color:"#fff",fontSize:16,fontWeight:700,letterSpacing:.3}}>BAKARA</div><div style={{color:"#64748b",fontSize:9}}>Gestion financiere {storage.isOnline()?"● En ligne":"○ Local"}</div></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          {saved&&<span style={{color:"#22c55e",fontSize:10,fontWeight:600,animation:"fadeIn .3s"}}>✓ Sauvegarde</span>}
          {roleBadge&&<span title={profile.email} style={{background:roleBadge.c,color:"#fff",padding:"4px 10px",borderRadius:6,fontSize:9,fontWeight:700,letterSpacing:.5,textTransform:"uppercase"}}>{roleBadge.l}</span>}
          {session&&<button onClick={logout} title={"Se deconnecter ("+(profile?.email||"")+")"} style={{background:"#334155",color:"#fff",border:"none",borderRadius:6,padding:"6px 12px",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:600,minHeight:32}}>⏏ Logout</button>}
        </div>
      </div>
      <div style={{display:"flex",gap:4,overflowX:"auto"}}>
        {TABS.map(t=><button key={t.k} className="tab-btn" onClick={()=>setTab(t.k)} style={{padding:"9px 18px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap",fontFamily:"inherit",background:tab===t.k?"#3b82f6":"transparent",color:tab===t.k?"#fff":"#94a3b8",transition:"all .2s",minHeight:38}}>{t.i} {t.l}</button>)}
      </div>
    </div>
    <div style={{padding:"16px",maxWidth:1000,margin:"0 auto"}}>
      {tab==="dash"&&<Dash ch={ch} al={al}/>}
      {tab==="ch"&&<Charges data={ch} setData={setCh} save={sC} ro={ro}/>}
      {tab==="al"&&<Alim data={al} setData={setAl} save={sA} ro={ro}/>}
      {tab==="lo"&&<Loyers data={lo} setData={setLo} save={sL} ro={ro} biens={bi} setBiens={setBi} saveBiens={sB}/>}
      {tab==="bi"&&<Biens data={bi} setData={setBi} save={sB} ro={ro} locs={lo} setLocs={setLo} saveLocs={sL}/>}
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

// ── PWA: Service Worker registration ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
</body>
</html>
